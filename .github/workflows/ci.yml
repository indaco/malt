name: CI

on:
  push:
    branches:
      - main
      - "release/**"
    paths:
      - "**/*.zig"
      - "**/*.zon"
      - "scripts/**/*.sh"
      - "justfile"
      - ".github/workflows/ci.yml"
  pull_request:
    branches:
      - main
      - "release/**"
    paths:
      - "**/*.zig"
      - "**/*.zon"
      - "scripts/**/*.sh"
      - "justfile"
      - ".github/workflows/ci.yml"

jobs:
  build-macos:
    name: Build & Test (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: false

      - name: Install just
        uses: taiki-e/install-action@v2.87.1
        with:
          tool: just

      - name: Build (Debug)
        run: just build

      # Drift guard: the committed man page is generated from the binary's
      # own --help, so a --help edit that skips `just man-gen` fails here.
      - name: Man page drift check
        run: just man-check

      - name: Build (ReleaseSafe)
        run: just build-release

      - name: Run unit tests
        run: zig build test --summary all

      - name: Smoke test — version flag
        run: ./zig-out/bin/malt --version

      - name: Smoke test — help flag
        run: ./zig-out/bin/malt --help

      # Offline CLI smoke: exercises every documented command + alias
      # against an isolated MALT_PREFIX. Tier 3 (network installs) is
      # skipped in CI — it lives in the benchmark workflow already.
      - name: CLI smoke (offline tiers)
        env:
          SMOKE_SKIP_NETWORK: "1"
        run: ./scripts/smokes/smoke_test.sh

      - name: Regression guard - bundle lock confinement
        run: ./scripts/regressions/bundle-lock-name-guard-bundle-lock-path-from-unvalidated-manifest-name.sh

      # Security smoke: flag-scope enforcement, argv-only lint,
      # pins-manifest shape, install.sh fail-closed regression suite.
      # Subsumes the individual install.sh step that used to live in
      # the Lint job.
      - name: Security smoke
        run: ./scripts/smokes/smoke_security.sh

      - name: Regression guard - Ruby-DSL Cellar confinement
        run: ./scripts/regressions/ruby-dsl-name-version-escape-cellar.sh

      - name: Regression guard - tap raw binary stays in its keg
        run: ./scripts/regressions/raw-binary-name-escapes-keg-tap-raw-binary-target-not-a-path-component.sh

      - name: Regression guard - Cellar delete confinement
        run: ./scripts/regressions/formula-name-version-reach-deletetree-unguarded.sh

      - name: Regression guard - Cellar symlink confinement
        run: ./scripts/regressions/cellar-sinks-follow-a-symlinked-package-dir.sh

      # Needs the integration test binaries, so it runs here off the warm
      # cache rather than paying for a second full build in its own job.
      - name: Regression guard - Cellar symlink refusal claims no store bytes
        run: ./scripts/regressions/cellar-symlink-followups-3-follow-up.sh

      # Rebuilds lib_tests, which only the warm cache here keeps under budget.
      - name: Regression guard - top-level multi-arch tap casks
        run: ./scripts/regressions/tap-cask-top-level-arch-kwargs-gh1096.sh

      - name: Regression guard - versionless keg
        run: ./scripts/regressions/versionless-keg-empty-stable-version-installs-a-versionless-keg.sh

      - name: Regression guard - store entries held by a live keg
        run: ./scripts/regressions/store-refcount-moment-does-not-match-a-reference.sh

      - name: Regression guard - sha256 :no_check only behind --allow-unpinned
        run: ./scripts/regressions/tap-no-check-opt-in-tap-sha256-no-check-refused.sh

      - name: Regression guard - blocked migrate claims no store bytes
        run: ./scripts/regressions/migrate-bump-precedes-materialize-961-follow-up.sh

      - name: Regression guard - store entries no keg holds are reclaimable
        run: ./scripts/regressions/store-orphans-trust-kegs-over-counter-failed-migrate-inflates-store-refcount-permanently.sh

      - name: Regression guard - doctor survives a relative keg path
        run: ./scripts/regressions/doctor-survives-a-relative-keg-path.sh

      - name: Regression guard - doctor tap-cache figure matches purge --cache
        run: ./scripts/regressions/doctor-tap-cache-figure-matches-purge-cache-doctor-suggests-purge-cache-but-running-it-nothing-to-reclaim.sh

      - name: Regression guard - wipe manifest matches mt backup
        run: ./scripts/regressions/wipe-manifest-tap-qualification-wipe-manifest-drops-tap-qualification-for-casks.sh

      - name: Regression guard - bundle import records the canonical manifest path
        run: ./scripts/regressions/bundle-import-canonical-manifest-path-bundle-import-records-relative-manifest-path.sh

      - name: Regression guard - INSTALL_RECEIPT.json mirrors the install reason
        run: ./scripts/regressions/receipt-mirrors-install-reason-install-receipt-always-claims-installed-on-request.sh

      - name: Regression guard - a named dependency is recorded as installed on request
        run: ./scripts/regressions/named-dependency-becomes-on-request.sh

      - name: Regression guard - store entry without the requested keg is refused
        run: ./scripts/regressions/materialize-refuses-store-entry-root-keg-source-falls-back-to-store-entry-root.sh

      - name: Regression guard - relocated cache warm hit checks the keg label
        run: ./scripts/regressions/relocated-cache-warm-hit-checks-label-relocated-cache-warm-hit-ignores-the-requested-name-and-version.sh

      - name: Regression guard - malformed MALT_CACHE is refused before wipe
        run: ./scripts/regressions/malt-cache-validated-before-wipe-malt-cache-unvalidated-and-wiped.sh

      - name: Regression guard - a degenerate MALT_APPDIR never becomes the cask placement directory
        run: ./scripts/regressions/appdir-env-shape-validated-cask-appdir-env-accepted-unvalidated-for-placement.sh

      - name: Regression guard - a binary cask rolls back to a linked executable and app casks link their declared binaries
        run: ./scripts/regressions/binary-cask-rollback-and-appdir-links-cask-binary-artifacts-rollback-and-appdir-sources.sh

      - name: Regression guard - an app cask links the helpers it ships beside its bundle
        run: ./scripts/regressions/app-cask-staged-binary-links-app-cask-staged-path-binaries-never-linked.sh

      - name: Regression guard - a patched Mach-O always reaches the re-sign list
        run: ./scripts/regressions/walk-refuses-to-drop-a-mutated-macho-mutated-macho-can-skip-resigning-on-append-failure.sh

      - name: Regression guard - link pre-check refuses sibling-version symlinks and occupied plain-file slots
        run: ./scripts/regressions/conflict-precheck-boundary-and-plain-file-conflict-precheck-prefix-match-and-skipped-targets.sh

      - name: Regression guard - subprocess extractors refuse escaping link targets
        run: ./scripts/regressions/xz-zip-extractors-lack-pax-linkpath-prescan.sh

      - name: Regression guard - xz and zip extraction stay within the byte budget
        run: ./scripts/regressions/archive-xz-zip-expansion-unbounded.sh

      - name: Regression guard - vulns scans tap kegs via OSV
        run: ./scripts/regressions/vulns-scans-tap-kegs-via-osv-vulns-skips-tap-and-local-kegs.sh

      - name: Regression guard - a tap or local formula's service block is registered on install
        run: ./scripts/regressions/tap-service-registered-on-install-tap-formula-service-block-never-parsed-or-registered.sh

      - name: Regression guard - a declared shipped plist missing from the keg is reported, not called unsupported
        run: ./scripts/regressions/shipped-plist-service-warns-why-tap-formula-shipped-plist-not-registered.sh

      - name: Regression guard - a core formula's shipped plist is lifted into a malt service on install and upgrade
        run: ./scripts/regressions/api-shipped-plist-service-warns-why-api-formula-shipped-plist-installs-silently.sh

      - name: Regression guard - a shipped launchd plist is lifted into a malt service and refusals name their cause
        run: ./scripts/regressions/shipped-plist-lifted-to-service-adopt-shipped-launchd-plist-as-a-service.sh

      - name: Regression guard - autoremove retires the service registration of the orphan it removes
        run: ./scripts/regressions/cleanup-retires-orphaned-dep-service.sh

      - name: Regression guard - autoremove reconciles the outdated snapshot with the keg it reaped
        run: ./scripts/regressions/purge-reconciles-outdated-snapshot.sh

      - name: Regression guard - a linux-only service block installs quietly and registers nothing
        run: ./scripts/regressions/linux-only-service-block-installs-quietly-linux-only-service-block-reported-as-unsupported.sh

      - name: Regression guard - upgrade retires a service the new version no longer declares
        run: ./scripts/regressions/upgrade-retires-dropped-service-upgrade-to-a-version-without-a-service-block-keeps-the-old-registration.sh

      - name: Regression guard - a service's working_dir is pre-created only under keg, var or etc
        run: ./scripts/regressions/service-working-dir-not-precreated-outside-keg-var-etc-service-working-dir-precreated-anywhere-under-prefix.sh

      - name: Regression guard - a dead tap host is paid for once per audit
        run: ./scripts/regressions/tap-dead-host-breaker-tap-audits-pay-full-retry-budget-per-keg-behind-one-dead-forge.sh

      - name: Regression guard - every retry attempt after a transient status reaches the peer
        run: ./scripts/regressions/stale-pool-retry-charge-retry-on-a-stale-pooled-connection-hides-the-status-a-peer-answered.sh

      - name: Regression guard - fetches honour HTTPS_PROXY
        run: ./scripts/regressions/proxy-env-routes-fetches-through-proxy-proxy-env.sh

      # Needs root to mint the setuid copy; the runner's passwordless sudo
      # keeps SUDO_USER set so the probe runs as the unprivileged caller.
      - name: Regression guard - setuid wrapper is refused
        run: sudo ./scripts/regressions/refuse-setuid-wrapper.sh

      - name: Build universal binary
        run: just build-universal

  lint:
    name: Lint
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: false

      - name: Check Zig formatting
        run: zig fmt --check src/ tests/

      - name: Install just
        uses: taiki-e/install-action@v2.87.1
        with:
          tool: just

      # Source scans and fixture checks — no build, no network, fast enough
      # to live in lint. The justfile recipe is the only list: a guard added
      # there is gated here, so local `just test` and CI cannot drift apart.
      - name: Static regression guards
        run: just regressions-static

      - name: Install shell-lint tools
        run: brew install shellcheck shfmt

      - name: Lint shell scripts (shellcheck + shfmt)
        run: |
          shellcheck scripts/*.sh scripts/lib/*.sh scripts/test/*.sh scripts/e2e/*.sh scripts/regressions/*.sh scripts/smokes/*.sh scripts/release/*.sh
          shfmt -i 2 -d scripts/*.sh scripts/lib/*.sh scripts/test/*.sh scripts/e2e/*.sh scripts/regressions/*.sh scripts/smokes/*.sh scripts/release/*.sh

  # The regression pool is where field bugs get their permanent guard, but
  # only the loopback ones can gate a PR - the rest need a token and live
  # installs. Running that subset here is what stops a guard from silently
  # never being run again after the branch that added it merges.
  regressions-hermetic:
    name: Regression guards (hermetic)
    runs-on: macos-14
    # Deliberate waiting dominates these: ~22 min of run time, 31 min observed
    # worst case. Bound generously so a genuine hang fails in an hour rather
    # than sitting for GitHub's six.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: false

      - name: Install just
        uses: taiki-e/install-action@v2.87.1
        with:
          tool: just

      # The guards bound themselves with `timeout`, which macOS does not ship.
      - name: Install coreutils
        run: brew install coreutils

      - name: Hermetic regression guards
        run: just regressions-hermetic

  # Split from the job above rather than appended to it: those guards are
  # already the longest pole at ~22 min, and these are compile-bound, so as
  # their own job they cost nothing on the critical path.
  regressions-harness:
    name: Regression guards (harness)
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: false

      - name: Install just
        uses: taiki-e/install-action@v2.87.1
        with:
          tool: just

      # The guards bound themselves with `timeout`, which macOS does not ship.
      - name: Install coreutils
        run: brew install coreutils

      - name: Harness regression guards
        run: just regressions-harness
