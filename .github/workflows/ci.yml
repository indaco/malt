name: CI

on:
  push:
    branches:
      - main
      - "release/**"
    paths:
      - "**/*.zig"
      - "**/*.zon"
      - "scripts/**/*.sh"
      - "src/core/pins_manifest.txt"
      - ".github/workflows/ci.yml"
  pull_request:
    branches:
      - main
      - "release/**"
    paths:
      - "**/*.zig"
      - "**/*.zon"
      - "scripts/**/*.sh"
      - "src/core/pins_manifest.txt"
      - ".github/workflows/ci.yml"

jobs:
  build-macos:
    name: Build & Test (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install just
        uses: taiki-e/install-action@v2.85.4
        with:
          tool: just

      - name: Build (Debug)
        run: just build

      # Drift guard: the committed man page is generated from the binary's
      # own --help, so a --help edit that skips `just man-gen` fails here.
      - name: Man page drift check
        run: just man-check

      - name: Build (ReleaseSafe)
        run: just build-release

      - name: Run unit tests
        run: zig build test --summary all

      - name: Smoke test — version flag
        run: ./zig-out/bin/malt --version

      - name: Smoke test — help flag
        run: ./zig-out/bin/malt --help

      # Offline CLI smoke: exercises every documented command + alias
      # against an isolated MALT_PREFIX. Tier 3 (network installs) is
      # skipped in CI — it lives in the benchmark workflow already.
      - name: CLI smoke (offline tiers)
        env:
          SMOKE_SKIP_NETWORK: "1"
        run: ./scripts/smokes/smoke_test.sh

      # Security smoke: flag-scope enforcement, argv-only lint,
      # pins-manifest shape, install.sh fail-closed regression suite.
      # Subsumes the individual install.sh step that used to live in
      # the Lint job.
      - name: Security smoke
        run: ./scripts/smokes/smoke_security.sh

      - name: Build universal binary
        run: just build-universal

  lint:
    name: Lint
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Check Zig formatting
        run: zig fmt --check src/ tests/

      # Static structural guard: every tap fetch URL, writeback URL,
      # and MALT_GITHUB_TOKEN reach stays inside src/core/tap.zig.
      # No build, no network — fast enough to live in lint.
      - name: Tap-resolution contract guard
        run: ./scripts/regressions/tap-resolution-contract.sh

      - name: Install shell-lint tools
        run: brew install shellcheck shfmt

      - name: Lint shell scripts (shellcheck + shfmt)
        run: |
          shellcheck scripts/*.sh scripts/lib/*.sh scripts/test/*.sh scripts/e2e/*.sh scripts/regressions/*.sh scripts/smokes/*.sh scripts/release/*.sh
          shfmt -i 2 -d scripts/*.sh scripts/lib/*.sh scripts/test/*.sh scripts/e2e/*.sh scripts/regressions/*.sh scripts/smokes/*.sh scripts/release/*.sh

  # Drift guard: verify every committed manifest entry's hash against the
  # committed pin on every PR. Catches "bumped pins.zig, forgot to
  # regenerate the manifest" (or vice-versa) and hand-edited entries —
  # fully reproducible because blobs and 404s are deterministic at a
  # pinned commit. Deliberately does NOT re-enumerate the live formula
  # list: that tracks homebrew-core HEAD and failed unrelated PRs whenever
  # upstream added or removed a post_install formula. Freshness is owned
  # by the scheduled pins-bump auto-PR, which runs the full regeneration.
  pins-drift:
    name: Pins drift
    runs-on: macos-14
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - name: Verify manifest against committed pin
        run: ./scripts/gen-pins.sh --check
